<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="primaryText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .orb-1 {
      animation: floatOrb1 10s ease-in-out infinite alternate;
    }
    .orb-2 {
      animation: floatOrb2 12s ease-in-out infinite alternate;
    }
    .orb-3 {
      animation: floatOrb3 8s ease-in-out infinite alternate;
    }
    .node-pulse {
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }
    .stream-line {
      stroke-dasharray: 8, 8;
      animation: dashStream 25s linear infinite;
    }

    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(80px, 40px) scale(1.15); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(-60px, -30px) scale(1.2); }
    }
    @keyframes floatOrb3 {
      0% { transform: translate(0px, 0px); }
      100% { transform: translate(40px, -50px); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.35; }
      100% { opacity: 0.75; }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -1000; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#gridPattern)" />

  <!-- Animated Glowing Orbs (in background) -->
  <g opacity="0.6">
    <circle class="orb-1" cx="200" cy="100" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.25" />
    <circle class="orb-2" cx="1020" cy="320" r="160" fill="#818cf8" filter="url(#glow)" opacity="0.3" />
    <circle class="orb-3" cx="620" cy="380" r="120" fill="#ec4899" filter="url(#glow)" opacity="0.2" />
  </g>

  <!-- Dynamic Asset Flow Lines (in background behind text) -->
  <g opacity="0.35" class="stream-line">
    <path d="M 50 80 Q 300 20 600 80 T 1150 80" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M 50 350 Q 350 420 700 340 T 1150 360" fill="none" stroke="#c084fc" stroke-width="2" />
    <path d="M 100 210 Q 550 120 1100 220" fill="none" stroke="#6366f1" stroke-width="1.5" />
  </g>

  <!-- Decorative Modern Asset Elements (Geometric / Cards) -->
  <g opacity="0.4" class="node-pulse">
    <rect x="70" y="270" width="130" height="90" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="100" cy="300" r="10" fill="#38bdf8" opacity="0.7"/>
    <rect x="120" y="295" width="60" height="8" rx="4" fill="#94a3b8" opacity="0.6"/>
    <rect x="90" y="325" width="90" height="6" rx="3" fill="#64748b" opacity="0.5"/>
    <rect x="90" y="338" width="60" height="6" rx="3" fill="#64748b" opacity="0.4"/>

    <rect x="1000" y="50" width="130" height="90" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" />
    <rect x="1020" y="75" width="40" height="40" rx="8" fill="#c084fc" opacity="0.3" />
    <path d="M 1030 100 L 1038 90 L 1046 96 L 1052 86" fill="none" stroke="#c084fc" stroke-width="2" />
    <rect x="1070" y="80" width="45" height="8" rx="4" fill="#94a3b8" opacity="0.7"/>
    <rect x="1070" y="96" width="35" height="6" rx="3" fill="#64748b" opacity="0.5"/>
  </g>

  <!-- Foreground Foreground Container for Guaranteed Legibility -->
  <g>
    <!-- Top Category Pill Badge -->
    <rect x="425" y="48" width="350" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.8" />
    <text x="600" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="1.5">
      📁 CURATED DIGITAL ASSET MANAGEMENT
    </text>

    <!-- Main Title -->
    <text x="600" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#primaryText)" letter-spacing="-0.5">
      Digital Asset Browser &amp; Organizer
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#e2e8f0" letter-spacing="0.2">
      The definitive directory of high-performance SaaS platforms &amp; open-source DAM systems
    </text>

    <!-- Value Proposition -->
    <text x="600" y="228" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
      Browse • Catalog • Tag • Search • AI Indexing • Multi-Terabyte RAW &amp; Media Workflows
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(190, 275)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="180" height="44" rx="22" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="90" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#38bdf8">⚡ High-Speed Culling</text>

      <!-- Pill 2 -->
      <rect x="210" y="0" width="190" height="44" rx="22" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="305" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#818cf8">🤖 AI Facial &amp; Semantic</text>

      <!-- Pill 3 -->
      <rect x="430" y="0" width="180" height="44" rx="22" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="520" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#c084fc">🔒 Privacy-First FOSS</text>

      <!-- Pill 4 -->
      <rect x="640" y="0" width="180" height="44" rx="22" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="730" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#34d399">☁️ Hybrid &amp; Cloud DAM</text>
    </g>

    <!-- Bottom Stat bar -->
    <text x="600" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">
      Verified Pricing &bull; Free Tier Details &bull; Market Valuations &bull; Open-Source Star Rankings
    </text>
  </g>
</svg>
